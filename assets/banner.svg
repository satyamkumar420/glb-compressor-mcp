<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="420" rx="16" fill="url(#purpleGlow)" />
  <rect width="1200" height="420" rx="16" fill="url(#emeraldGlow)" />

  <!-- Outer Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- 3D Geometric Isometric Wireframe Cube (Left Side Graphic) -->
  <g transform="translate(110, 130) scale(1.15)">
    <!-- Glow filter circle -->
    <circle cx="50" cy="50" r="85" fill="#38BDF8" fill-opacity="0.08" />

    <!-- Isometric Cube Outer Polygon -->
    <!-- Top Face -->
    <polygon points="50,0 95,25 50,50 5,25" fill="#0EA5E9" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.8" />
    <!-- Left Face -->
    <polygon points="5,25 50,50 50,105 5,80" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-width="1.8" />
    <!-- Right Face -->
    <polygon points="50,50 95,25 95,80 50,105" fill="#10B981" fill-opacity="0.12" stroke="#34D399" stroke-width="1.8" />

    <!-- Inner Mesh Wireframe Lines (Representing 3D Mesh Optimization) -->
    <line x1="50" y1="0" x2="50" y2="50" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="27" y1="12" x2="72" y2="37" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="72" y1="12" x2="27" y2="37" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    
    <line x1="27" y1="37" x2="27" y2="92" stroke="#818CF8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
    <line x1="72" y1="37" x2="72" y2="92" stroke="#34D399" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />

    <!-- Vertex Points / Dots -->
    <circle cx="50" cy="0" r="3.5" fill="#38BDF8" />
    <circle cx="95" cy="25" r="3.5" fill="#38BDF8" />
    <circle cx="50" cy="50" r="4.5" fill="#F8FAFC" />
    <circle cx="5" cy="25" r="3.5" fill="#38BDF8" />
    <circle cx="5" cy="80" r="3.5" fill="#818CF8" />
    <circle cx="50" cy="105" r="3.5" fill="#34D399" />
    <circle cx="95" cy="80" r="3.5" fill="#34D399" />
  </g>

  <!-- Header Category Pill -->
  <g transform="translate(300, 75)">
    <rect width="260" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="15" r="4" fill="#34D399" />
    <text x="28" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">CLOUDFLARE WORKERS · MCP</text>
  </g>

  <!-- Main Title -->
  <text x="300" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">GLB COMPRESSOR <tspan fill="url(#brandGrad)">MCP</tspan></text>

  <!-- Subtitle -->
  <text x="300" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
    High-Fidelity 3D Optimization Engine · WebAssembly Meshopt &amp; Draco · Zero Visual Degradation
  </text>

  <!-- Feature Cards Grid (4 Badges) -->
  <g transform="translate(300, 240)">
    <!-- Card 1: 0% Quality Loss -->
    <g transform="translate(0, 0)">
      <rect width="195" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <rect x="1" y="1" width="193" height="4" rx="2" fill="#10B981" />
      <text x="18" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">🛡️ 0% Loss</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">100% Polygon &amp; Mesh</text>
      <text x="18" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Silhouette Preserved</text>
    </g>

    <!-- Card 2: 40-85% Reduction -->
    <g transform="translate(210, 0)">
      <rect width="195" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <rect x="1" y="1" width="193" height="4" rx="2" fill="#38BDF8" />
      <text x="18" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">⚡ 40-85%</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Massive File Savings</text>
      <text x="18" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Fast Edge Compression</text>
    </g>

    <!-- Card 3: Cloudflare Edge -->
    <g transform="translate(420, 0)">
      <rect width="195" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <rect x="1" y="1" width="193" height="4" rx="2" fill="#F59E0B" />
      <text x="18" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">🌐 Cloudflare</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Streamable HTTP &amp; SSE</text>
      <text x="18" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Serverless Edge Deploy</text>
    </g>

    <!-- Card 4: WebAssembly Engine -->
    <g transform="translate(630, 0)">
      <rect width="195" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <rect x="1" y="1" width="193" height="4" rx="2" fill="#8B5CF6" />
      <text x="18" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">💎 WASM Core</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Meshoptimizer &amp; Draco</text>
      <text x="18" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Instant Web Decode</text>
    </g>
  </g>

  <!-- Bottom Tech Bar -->
  <g transform="translate(300, 360)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B">
      COMPATIBLE WITH: <tspan fill="#CBD5E1">Three.js</tspan> · <tspan fill="#CBD5E1">Babylon.js</tspan> · <tspan fill="#CBD5E1">Godot 4</tspan> · <tspan fill="#CBD5E1">model-viewer</tspan> · <tspan fill="#CBD5E1">Unity WebGL</tspan> · <tspan fill="#CBD5E1">Claude Desktop</tspan> · <tspan fill="#CBD5E1">AGY</tspan>
    </text>
  </g>
</svg>
